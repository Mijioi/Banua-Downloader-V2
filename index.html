<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banua Downloader</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;padding:20px;text-align:center}input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0}button{padding:12px 20px;background:#fe2c55;color:#fff;border:none;border-radius:8px;font-weight:bold}video{width:100%;margin-top:15px;border-radius:10px}a{display:block;margin-top:10px;background:#25F4EE;color:#000;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold}</style>
</head><body>
<h2>Banua Downloader 🔥</h2>
<input id="url" placeholder="Paste link TikTok disini">
<button onclick="download()">DOWNLOAD</button>
<div id="result"></div>
<script>
async function download(){
 let url=document.getElementById('url').value;
 if(!url) return alert('Isi link dulu');
 document.getElementById('result').innerHTML='Loading...';
 let res=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
 let data=await res.json();
 if(data.error) return document.getElementById('result').innerHTML=data.error;
 document.getElementById('result').innerHTML=`<p>${data.title}</p><video controls src="${data.video}"></video><a href="${data.video}" target="_blank">⬇️ DOWNLOAD VIDEO</a><a href="${data.music}" target="_blank">🎵 DOWNLOAD MP3</a>`;
}
</script>
</body></html>
